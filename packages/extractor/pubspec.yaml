name: extractor
description: A robust Flutter plugin for downloading videos and audio from 1000+ websites using yt-dlp. Features quality selection, format conversion, progress tracking, and more.
# FORK Liquid YT (v1.0.9): igual que extractor 1.0.0, salvo
# LibraryService.initialize, que ahora extrae Python/FFmpeg en
# Dispatchers.IO en vez del hilo principal (el init original mataba la
# app en gama baja). Ver android/.../service/LibraryService.kt.
version: 1.0.0+liquidyt.1
homepage: https://github.com/ashishpipaliya/extractor
repository: https://github.com/ashishpipaliya/extractor
issue_tracker: https://github.com/ashishpipaliya/extractor/issues

environment:
  sdk: ">=2.17.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^1.0.0
  pigeon: ^22.7.0

flutter:
  plugin:
    platforms:
      android:
        package: com.ashishpipaliya.extractor
        pluginClass: ExtractorPlugin
